# GovWren deployment settings.
#
# This file describes how the server runs. Everything about the governance program itself
# (forms, risk tiers, review rules, vocabularies) and the product's appearance (name, logo,
# colors) is set in the app, under Admin, and is stored in the database.
#
# Any value here can be overridden by an environment variable named GOVWREN_<SECTION>_<KEY>,
# for example GOVWREN_SERVER_PORT=8080. Secrets are never written in this file: where one is
# needed, the file names the environment variable that holds it.
#
# Relative paths are resolved against this file's own directory.

[server]
# The address and port the web server listens on. Keep 127.0.0.1 when a reverse proxy on the
# same machine terminates TLS; use 0.0.0.0 only behind one.
host = "127.0.0.1"
port = 8000

# How many server processes to run. One is enough for SQLite and small teams.
workers = 1

# The public address people use to reach GovWren, such as "https://govwren.example.org".
# Used in links in email. Leave empty to use the address of each request.
base_url = ""

# A sign-in ends after this long without activity, and after this long in any case.
session_idle_hours = 12
session_max_days = 7
# Run scheduled work in this server: periodic reviews, lapsed approvals, reminders,
# and email. Set to false only if `govwren jobs run` is called from a scheduled task.
scheduler = true

[database]
# Leave empty to use SQLite, in a single file inside the data home.
# For PostgreSQL: "postgresql+psycopg://govwren@db.example.org:5432/govwren", with the
# password in the PGPASSWORD environment variable (or set the whole address, password and
# all, in GOVWREN_DATABASE_URL). PostgreSQL needs the optional driver: uv sync --extra postgres
url = ""

[data]
# The data home: evidence files, uploaded logos, exports, logs, and the SQLite database.
home = "var"

[sso]
# Single sign-on through an OpenID Connect provider, such as Microsoft Entra ID. Leave the
# issuer empty to use local accounts only. See docs/single-sign-on.md.
#
# The issuer is the provider's address for your organization; GovWren reads the rest from
# <issuer>/.well-known/openid-configuration. Register GovWren with the provider as a web
# application whose redirect address is <base_url>/api/v1/sso/callback.
issuer = ""
client_id = ""

# The NAME of the environment variable that holds the client secret. The secret itself is
# never written in this file.
client_secret_env = "GOVWREN_SSO_CLIENT_SECRET"

scopes = "openid profile email"

# The claim in the ID token that lists a person's groups or application roles. Which of them
# gives which role here is set in the app, under Admin, Single sign-on.
groups_claim = "groups"

# The words on the sign-in button.
label = "Sign in with your organization account"

# Set to true only if the provider is your organization's own and every address it sends
# belongs to the person signing in. It lets a first sign-in join an account an administrator
# created earlier with the same email address, even when the provider does not mark the
# address as verified.
trust_email = false

# Set to false to stop password sign-in for everyone except administrators, who keep it as
# a way in if the provider is unreachable.
local_sign_in = true

[mail]
# Email over SMTP: notices as they happen, or a daily summary, as each person chooses.
# Leave the host empty to send no email. See docs/email.md.
host = ""
port = 587

# "starttls" (the usual choice on port 587), "tls" (port 465), or "none" (only for a relay on
# this machine or a trusted network).
security = "starttls"

# Leave the user name empty if the server needs none. The password is never written here:
# this is the NAME of the environment variable that holds it.
username = ""
password_env = "GOVWREN_MAIL_PASSWORD"

# The address email comes from, and the name shown beside it (the product's name if empty).
from_address = ""
from_name = ""

# The hour, in UTC, at which daily summaries are put together.
digest_hour = 7
