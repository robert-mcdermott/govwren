[project]
name = "govwren"
version = "0.3.0"
description = "An open system of record for AI governance: one front door, review in proportion to risk, a living inventory, and evidence behind every decision."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The GovWren Authors" }]
requires-python = ">=3.12"
keywords = ["AI governance", "risk management", "inventory", "intake", "compliance", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.8"]

[project.scripts]
govwren = "govwren.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "S"]
ignore = [
    "S101",  # assert is fine in tests and invariants
    "S603",  # subprocess calls use fixed argument lists
    "S607",  # git is resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S311", "S608"]
# Spreadsheets under test are written out as they would be typed.
"tests/test_record_imports.py" = ["E501", "S104", "S105", "S106", "S108", "S311", "S608"]
# Migrations are written once and read rarely; long constraint lines stay whole.
"src/govwren/db/migrations/versions/**" = ["E501"]
# The demo organization is invented with a seeded generator.
"src/govwren/demo/**" = ["S311"]
# Its content is tables of words and sentences, kept one entry to a line.
"src/govwren/demo/content.py" = ["E501", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs GOVWREN_TEST_POSTGRES_URL (see CONTRIBUTING.md)",
    "sqlite_only: about the SQLite database file, so skipped when the suite runs on PostgreSQL",
]
filterwarnings = [
    "error::DeprecationWarning:govwren.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
