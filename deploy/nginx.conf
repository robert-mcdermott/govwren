# GovWren behind nginx. Replace ai.example.org and the certificate paths with yours.

server {
    listen 80;
    server_name ai.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.example.org;

    ssl_certificate     /etc/ssl/certs/ai.example.org.pem;
    ssl_certificate_key /etc/ssl/private/ai.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 30m;   # evidence files are up to 25 MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
