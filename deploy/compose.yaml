# GovWren with PostgreSQL, for docker compose or podman compose.
#
#   cp deploy/compose.env.example deploy/.env     then edit deploy/.env
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
#
# GovWren listens on 127.0.0.1:8000 of the host. Put a reverse proxy with TLS in front of
# it: see deploy/Caddyfile and deploy/nginx.conf.

services:
  govwren:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: govwren:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOVWREN_SERVER_BASE_URL: ${GOVWREN_BASE_URL:?set GOVWREN_BASE_URL in deploy/.env}
      GOVWREN_SERVER_WORKERS: ${GOVWREN_WORKERS:-2}
      GOVWREN_DATABASE_URL: postgresql+psycopg://govwren@db:5432/govwren
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Used once, on the first start, to create the first administrator.
      GOVWREN_ADMIN_EMAIL: ${GOVWREN_ADMIN_EMAIL:-}
      GOVWREN_ADMIN_NAME: ${GOVWREN_ADMIN_NAME:-Administrator}
      GOVWREN_ADMIN_PASSWORD: ${GOVWREN_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - govwren-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: govwren
      POSTGRES_DB: govwren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - govwren-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govwren -d govwren"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  govwren-data:
  govwren-db:
